services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8080:3001"
    environment:
      MONGO_URL: mongodb://mongo:27017/west_food
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      FRONTEND_URL: http://localhost:8080
    volumes:
      - menu-data:/app/storage
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  menu-data:
