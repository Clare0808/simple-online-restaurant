services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "3001:10000"
    environment:
      PORT: 10000
      MONGO_URL: mongodb://mongo:27017/simple_online_restaurant
      JWT_SECRET: ${JWT_SECRET:-local-docker-development-secret-change-me-32chars}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
